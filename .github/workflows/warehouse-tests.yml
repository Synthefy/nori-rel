name: Live certification

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact_name:
        description: Validated candidate artifact from the calling release run
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: live-certification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    if: github.repository == 'Synthefy/nori-rel' && github.ref == 'refs/heads/main'
    environment: warehouse
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nori_rel_test
          POSTGRES_PASSWORD: integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nori_rel_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NORI_REL_TEST_DATABASE_URL: postgresql://postgres:integration@127.0.0.1:5432/nori_rel_test
      NORI_REL_TEST_MANAGED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test configurations hold no credentials but name our accounts. A
      # secret is masked only as a whole string, so also mask each identifying
      # field in case a test or driver prints it on its own.
      - name: Mask warehouse account identifiers in the logs
        env:
          NORI_REL_TEST_SNOWFLAKE_CONFIG: ${{ secrets.NORI_REL_TEST_SNOWFLAKE_CONFIG }}
          NORI_REL_TEST_DATABRICKS_CONFIG: ${{ secrets.NORI_REL_TEST_DATABRICKS_CONFIG }}
        run: |
          python3 - <<'PY'
          import json
          import os

          IDENTIFYING_FIELDS = {"account", "server_hostname", "http_path", "reader_principal"}


          def get_identifying_values(value):
              """Return the identifying field values nested anywhere in a config."""
              if isinstance(value, dict):
                  for key, item in value.items():
                      if key in IDENTIFYING_FIELDS and isinstance(item, str) and item:
                          yield item
                          yield item.lower()
                      else:
                          yield from get_identifying_values(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from get_identifying_values(item)


          for name in ("NORI_REL_TEST_SNOWFLAKE_CONFIG", "NORI_REL_TEST_DATABRICKS_CONFIG"):
              if os.environ.get(name):
                  for value in set(get_identifying_values(json.loads(os.environ[name]))):
                      print(f"::add-mask::{value}")
          PY
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.21"
          python-version: "3.12"
          enable-cache: true
      - run: >-
          uv sync --locked --group dev --group cpu
          --extra database --extra snowflake --extra databricks --extra local
      - name: Retrieve the exact release candidate
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: release-artifacts
      - name: Replace the editable install with the candidate wheel
        if: inputs.artifact_name != ''
        run: |
          uv pip install --python .venv --no-deps --reinstall-package nori-rel release-artifacts/dist/*.whl
          uv run --no-sync python -c 'from pathlib import Path; import nori_rel; assert "site-packages" in Path(nori_rel.__file__).parts, nori_rel.__file__'
      # 0.4.6: the Databricks test workspace rejects the certification
      # credentials (invalid_client), so this step certifies Snowflake only.
      # Restore "warehouse and not live_nori" once new Databricks credentials
      # are in the warehouse environment.
      - name: Certify Snowflake (Databricks and parity skipped)
        env:
          NORI_REL_TEST_SNOWFLAKE_CONFIG: ${{ secrets.NORI_REL_TEST_SNOWFLAKE_CONFIG }}
          NORI_REL_TEST_DATABRICKS_CONFIG: ${{ secrets.NORI_REL_TEST_DATABRICKS_CONFIG }}
          NORI_REL_TEST_SNOWFLAKE_READER: ${{ secrets.NORI_REL_TEST_SNOWFLAKE_READER }}
          NORI_REL_TEST_SNOWFLAKE_WRITER: ${{ secrets.NORI_REL_TEST_SNOWFLAKE_WRITER }}
          NORI_REL_TEST_DATABRICKS_READER: ${{ secrets.NORI_REL_TEST_DATABRICKS_READER }}
          NORI_REL_TEST_DATABRICKS_WRITER: ${{ secrets.NORI_REL_TEST_DATABRICKS_WRITER }}
        run: >-
          uv run --no-sync pytest tests/connectors/test_warehouse_live.py
          -m "warehouse and not live_nori and not databricks and not parity"
          --require-warehouse --junitxml=reports/warehouses.xml
      - name: Fetch and record the public local checkpoint
        run: |
          uv run --no-sync python - <<'PY'
          import json
          from dataclasses import asdict
          from pathlib import Path
          from nori_rel._checkpoint import get_pinned_checkpoint
          checkpoint = get_pinned_checkpoint("nori-30m")
          provenance = asdict(checkpoint) | {"sha256": checkpoint.sha256}
          Path("reports").mkdir(exist_ok=True)
          Path("reports/local-checkpoint.json").write_text(json.dumps(provenance, indent=2) + "\n")
          PY
      - name: Certify real PostgreSQL to offline local inference
        env:
          HF_HUB_OFFLINE: "1"
        run: >-
          uv run --no-sync pytest
          tests/pql/test_local_postgres.py::test_offline_postgres_to_cached_local_nori
          --require-local-model --junitxml=reports/local-inference.xml
      - name: Certify real PostgreSQL to hosted inference
        env:
          NORI_REL_TEST_HOSTED_API_KEY: ${{ secrets.NORI_REL_TEST_HOSTED_API_KEY }}
          NORI_REL_TEST_HOSTED_MODEL: ${{ vars.NORI_REL_TEST_HOSTED_MODEL || 'synthefy/nori-30m' }}
        run: >-
          uv run --no-sync pytest
          tests/pql/test_client_e2e.py::test_live_hosted_pql_smoke
          --require-hosted-model --junitxml=reports/hosted-inference.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-certification-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
