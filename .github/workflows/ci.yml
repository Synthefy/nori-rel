name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.21"

# One job runs every pull-request and main check in sequence on Linux with
# Python 3.12 and PostgreSQL 18. The full matrix (Python 3.11, PostgreSQL 16,
# each extra alone, the sdist, macOS, Windows) is release-matrix.yml, which
# publish.yml runs before any upload. The job keeps the release-readiness name
# that branch protection and scripts/verify_release.py require.
jobs:
  release-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: nori_rel_test
          POSTGRES_PASSWORD: integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nori_rel_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NORI_REL_TEST_DATABASE_URL: postgresql://postgres:integration@127.0.0.1:5432/nori_rel_test
      NORI_REL_TEST_MANAGED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Install the development environment
        run: >-
          uv sync --locked --group dev --group cpu --group build
          --extra database --extra snowflake --extra databricks --extra local
          --extra agentic

      - name: Check formatting and lint
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

      - name: Install the verified secret scanner
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the complete history reachable from this public commit
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts=HEAD --redact --no-banner .'

      - name: Test the public client and real PostgreSQL
        run: >-
          uv run --no-sync pytest -m "not warehouse and not live_nori"
          --junitxml=reports/tests.xml

      - name: Build the distributions
        run: uv build --no-sources --no-create-gitignore --out-dir release-artifacts/dist
      - name: Validate the distributions
        run: >-
          uv run --no-sync python scripts/validate_artifacts.py release-artifacts/dist
          --manifest release-artifacts/manifest.json
      - name: Validate built files through the publisher's candidate gate
        run: |
          uv run --no-sync python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.verify_release import build_candidate_provenance, validate_candidate_artifacts
          manifest = json.loads(Path("release-artifacts/manifest.json").read_text())
          for target in ("testpypi", "pypi"):
              manifest["candidate"] = build_candidate_provenance(os.environ["GITHUB_RUN_ID"], target)
              validate_candidate_artifacts(
                  manifest, Path("release-artifacts/dist"),
                  commit=os.environ["GITHUB_SHA"], version=manifest["version"],
                  candidate_run=os.environ["GITHUB_RUN_ID"], candidate_target=target,
              )
          PY
      - run: uv run --no-sync twine check --strict release-artifacts/dist/*

      - name: Install the built wheel with every extra, outside the checkout
        run: |
          version="$(uv run --no-sync python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          extras="database,snowflake,databricks,local,agentic"
          uv export --locked --all-extras --all-groups --no-emit-project \
            --no-hashes --no-annotate --output-file "$RUNNER_TEMP/release-constraints.txt" > /dev/null
          uv venv "$RUNNER_TEMP/artifact-venv"
          wheel="$(find "$GITHUB_WORKSPACE/release-artifacts/dist" -name "*.whl" -type f)"
          # Fetch only the CPU torch wheel here; its pinned dependencies come
          # from PyPI in the complete package install below.
          uv pip install --python "$RUNNER_TEMP/artifact-venv" --no-deps \
            --constraint "$RUNNER_TEMP/release-constraints.txt" \
            torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python "$RUNNER_TEMP/artifact-venv" \
            --constraint "$RUNNER_TEMP/release-constraints.txt" "${wheel}[${extras}]"
          uv pip check --python "$RUNNER_TEMP/artifact-venv"
          cd "$RUNNER_TEMP"
          uv run --no-project --python "$RUNNER_TEMP/artifact-venv" \
            "$GITHUB_WORKSPACE/scripts/smoke_install.py" --extras "$extras" --version "$version"

      - name: Audit every locked dependency
        run: |
          mkdir audit
          uv export --locked --all-extras --all-groups --no-emit-project \
            --no-hashes --no-annotate -o audit/locked-requirements.txt
          python - <<'PY'
          import re
          from pathlib import Path
          original = Path("audit/locked-requirements.txt").read_text()
          # PyPI advisories identify the upstream Torch release, not its +cpu
          # wheel flavor; the lock and installs are unchanged.
          requirements = re.sub(r"(?m)^(torch==[^+;\s]+)\+cpu(?=\s|$)", r"\1", original)
          Path("audit/requirements.txt").write_text(requirements)
          PY
          uvx --python 3.12 --from pip-audit==2.10.1 \
            python scripts/audit_dependencies.py \
            --requirements audit/requirements.txt --output audit

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: ci-reports
          path: |
            reports/
            audit/
            release-artifacts/
          retention-days: 14
          if-no-files-found: warn
