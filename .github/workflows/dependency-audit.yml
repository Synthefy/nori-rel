name: Dependency audit

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.21"
          python-version: ${{ matrix.python }}
      - name: Export every retained locked dependency
        run: |
          mkdir audit
          uv export --locked --all-extras --all-groups --no-emit-project \
            --no-hashes --no-annotate -o audit/locked-requirements.txt
          python - <<'PY'
          import re
          from pathlib import Path
          original = Path("audit/locked-requirements.txt").read_text()
          # PyPI advisories identify the upstream Torch release, not its +cpu
          # wheel flavor. Preserve the original export and audit the same public
          # version; no package is omitted or changed in the actual lock/install.
          requirements = re.sub(r"(?m)^(torch==[^+;\s]+)\+cpu(?=\s|$)", r"\1", original)
          Path("audit/requirements.txt").write_text(requirements)
          PY
      - name: Audit every dependency and enforce reviewed applicability
        env:
          AUDIT_PYTHON: ${{ matrix.python }}
        run: >-
          uvx --python "$AUDIT_PYTHON" --from pip-audit==2.10.1
          python scripts/audit_dependencies.py
          --requirements audit/requirements.txt --output audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audit-${{ matrix.os }}-${{ matrix.python }}
          path: audit/
          if-no-files-found: error
          retention-days: 30
