name: Release matrix

# The full cross-platform matrix: both supported Python versions, both
# PostgreSQL versions, every extra installed alone from the built wheel, the
# sdist, macOS and Windows. Pull requests and main pushes run one consolidated
# CI job instead; publish.yml runs this before building a candidate, and a
# maintainer can dispatch it to check a commit early.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.21"

jobs:
  postgres:
    name: postgres (Python ${{ matrix.python }}, PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            postgres: "16"
          - python: "3.12"
            postgres: "18"
          - python: "3.13"
            postgres: "18"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: nori_rel_test
          POSTGRES_PASSWORD: integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nori_rel_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NORI_REL_TEST_DATABASE_URL: postgresql://postgres:integration@127.0.0.1:5432/nori_rel_test
      NORI_REL_TEST_MANAGED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: >-
          uv sync --locked --group dev --group cpu
          --extra database --extra snowflake --extra databricks --extra local
          --extra agentic
      - name: Test public client and real PostgreSQL
        run: >-
          uv run --no-sync pytest -m "not warehouse and not live_nori"
          --junitxml=reports/tests.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tests-python-${{ matrix.python }}
          path: reports/tests.xml
          retention-days: 14
          if-no-files-found: warn

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --locked --only-group build
      - run: uv build --no-sources --no-create-gitignore --out-dir release-artifacts/dist
      - run: >-
          uv run --no-sync python scripts/validate_artifacts.py release-artifacts/dist
          --manifest release-artifacts/manifest.json
      - name: Validate built files through the publisher's candidate gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.verify_release import build_candidate_provenance, validate_candidate_artifacts
          manifest = json.loads(Path("release-artifacts/manifest.json").read_text())
          for target in ("testpypi", "pypi"):
              manifest["candidate"] = build_candidate_provenance(os.environ["GITHUB_RUN_ID"], target)
              validate_candidate_artifacts(
                  manifest, Path("release-artifacts/dist"),
                  commit=os.environ["GITHUB_SHA"], version=manifest["version"],
                  candidate_run=os.environ["GITHUB_RUN_ID"], candidate_target=target,
              )
          PY
      - run: uv run --no-sync twine check --strict release-artifacts/dist/*
      - id: version
        run: python -c 'import os,tomllib; print("version=" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"], file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

  artifact-install:
    name: artifact (${{ matrix.os }}, ${{ matrix.python }}, ${{ matrix.extras || 'base' }}, ${{ matrix.format }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.11", extras: "", format: whl}
          - {os: ubuntu-24.04, python: "3.12", extras: "", format: whl}
          - {os: ubuntu-24.04, python: "3.13", extras: "", format: whl}
          - {os: ubuntu-24.04, python: "3.11", extras: database, format: whl}
          - {os: ubuntu-24.04, python: "3.12", extras: database, format: whl}
          - {os: ubuntu-24.04, python: "3.11", extras: snowflake, format: whl}
          - {os: ubuntu-24.04, python: "3.12", extras: snowflake, format: whl}
          - {os: ubuntu-24.04, python: "3.13", extras: snowflake, format: whl}
          - {os: ubuntu-24.04, python: "3.11", extras: databricks, format: whl}
          - {os: ubuntu-24.04, python: "3.12", extras: databricks, format: whl}
          - {os: ubuntu-24.04, python: "3.13", extras: databricks, format: whl}
          - {os: ubuntu-24.04, python: "3.11", extras: local, format: whl}
          - {os: ubuntu-24.04, python: "3.12", extras: local, format: whl}
          - {os: ubuntu-24.04, python: "3.12", extras: "database,local", format: whl}
          - {os: ubuntu-24.04, python: "3.11", extras: agentic, format: whl}
          - {os: ubuntu-24.04, python: "3.12", extras: agentic, format: whl}
          - {os: ubuntu-24.04, python: "3.12", extras: "database,local,agentic", format: whl}
          - {os: ubuntu-24.04, python: "3.13", extras: "database,local,agentic", format: whl}
          - {os: macos-14, python: "3.13", extras: "snowflake,local", format: whl}
          - {os: windows-2022, python: "3.13", extras: "snowflake,local", format: whl}
          - {os: ubuntu-24.04, python: "3.11", extras: database, format: tar.gz}
          - {os: macos-14, python: "3.12", extras: database, format: whl}
          - {os: windows-2022, python: "3.12", extras: database, format: whl}
    defaults:
      run:
        shell: bash
    env:
      EXTRAS: ${{ matrix.extras }}
      FORMAT: ${{ matrix.format }}
      PACKAGE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: release-artifacts
      - name: Install only the selected extra from the distribution
        run: |
          uv export --locked --all-extras --all-groups --no-emit-project \
            --no-hashes --no-annotate --output-file "$RUNNER_TEMP/release-constraints.txt" > /dev/null
          uv venv "$RUNNER_TEMP/artifact-venv"
          artifact="$(find "$GITHUB_WORKSPACE/release-artifacts/dist" -name "*.$FORMAT" -type f)"
          selection="$artifact"
          if [ -n "$EXTRAS" ]; then selection="${artifact}[$EXTRAS]"; fi
          if [[ "$EXTRAS" == *local* ]]; then
            # Fetch only the CPU wheel here; its pinned dependencies come from
            # PyPI in the complete package install below.
            uv pip install --python "$RUNNER_TEMP/artifact-venv" \
              --no-deps \
              --constraint "$RUNNER_TEMP/release-constraints.txt" \
              torch --index-url https://download.pytorch.org/whl/cpu
          fi
          uv pip install --python "$RUNNER_TEMP/artifact-venv" \
            --constraint "$RUNNER_TEMP/release-constraints.txt" "$selection"
          uv pip check --python "$RUNNER_TEMP/artifact-venv"
          cd "$RUNNER_TEMP"
          uv run --no-project --python "$RUNNER_TEMP/artifact-venv" \
            "$GITHUB_WORKSPACE/scripts/smoke_install.py" --extras "$EXTRAS" --version "$PACKAGE_VERSION"
