name: Dependency compatibility

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        resolution: [lowest-direct, highest]
    env:
      RESOLUTION: ${{ matrix.resolution }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.21"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Resolve published dependency bounds without the developer lock
        run: >-
          uv pip compile pyproject.toml --no-sources --group dev
          --extra database --extra snowflake --extra databricks --extra agentic
          --resolution "$RESOLUTION" -o requirements-compat.txt
      - name: Test the installed distribution against that resolution
        run: |
          uv build --no-sources --no-create-gitignore --out-dir dist
          uv venv "$RUNNER_TEMP/compat-venv"
          uv pip install --python "$RUNNER_TEMP/compat-venv" -r requirements-compat.txt
          uv pip install --python "$RUNNER_TEMP/compat-venv" --no-deps dist/*.whl
          uv pip check --python "$RUNNER_TEMP/compat-venv"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          cd "$RUNNER_TEMP"
          uv run --no-project --python "$RUNNER_TEMP/compat-venv" \
            "$GITHUB_WORKSPACE/scripts/smoke_install.py" --extras database,snowflake,databricks,agentic --version "$version"
          uv run --no-project --python "$RUNNER_TEMP/compat-venv" pytest \
            "$GITHUB_WORKSPACE/tests/feature" \
            "$GITHUB_WORKSPACE/tests/pql/test_parser.py" \
            "$GITHUB_WORKSPACE/tests/pql/test_binding.py" \
            "$GITHUB_WORKSPACE/tests/pql/test_dialects.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependencies-${{ matrix.python }}-${{ matrix.resolution }}
          path: requirements-compat.txt
          if-no-files-found: warn
          retention-days: 14
