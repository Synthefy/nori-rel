version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions-maintenance:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python-maintenance:
        applies-to: version-updates
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Model-runtime changes require explicit compatibility and checkpoint review.
      - dependency-name: synthefy-nori
